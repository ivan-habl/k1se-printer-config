# =============================================================================
#  Термозащита покрытия стола при работе тензо-пробы (CS1237)
#  Замена activate_gcode, который [load_cell_probe] не читает.
#  probe_temp — единственное место, где задана температура сопла для пробы:
#  её же использует START_PRINT (macros/print.cfg).
#  _PROBE_TEMP_GUARD вызывается из обёрток ниже и из [homing_override]
#  перед G28 Z (macros/homing.cfg).
# =============================================================================

[gcode_macro _PROBE_TEMP_GUARD]
description: Снижение/ожидание температуры сопла перед касанием стола
variable_probe_temp: 140
gcode:
    {% set max_t = probe_temp + 5 %}
    {% set actual_t = printer.extruder.temperature %}
    {% set target_t = printer.extruder.target %}
    {% if target_t > probe_temp %}
        { action_respond_info('Сопло горячее (цель %.1f °C) — снижаю до %.1f °C перед тензо-пробой' % (target_t, probe_temp)) }
        M109 S{probe_temp}
    {% elif actual_t > max_t %}
        { action_respond_info('Ожидание остывания сопла с %.1f °C до %.1f °C...' % (actual_t, max_t)) }
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={max_t}
    {% endif %}

# --- Обёртки команд пробы: сначала защита, затем штатная команда -------------
# BED_MESH_CALIBRATE дополнительно выполняет плавную подводку к первой точке:
#  - штатный ProbePointsHelper._raise_tool(is_first=True) опускает Z до
#    horizontal_move_z на скорости [bed_mesh] speed (250 мм/с), сразу за этим
#    идёт самый длинный диагональный переезд сессии;
#  - LoadCellProbingMove._pause_and_tare снимает тару (tare_time) сразу после
#    последнего движения, без паузы: остаточные колебания портала дают
#    смещённую тару и ложный триггер у горизонтального уровня (z≈horizontal_move_z).
# Поэтому голова заранее подводится к первой точке на скоростях из _HOMING_CFG
# и выдерживается z_settle_ms, после чего штатные «подъём» и «переезд» к первой
# точке получаются нулевой длины, а тара снимается на успокоившемся портале.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: BED_MESH_CALIBRATE с термозащитой сопла и подводкой к первой точке
gcode:
    _PROBE_TEMP_GUARD
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set mesh = printer.configfile.settings.bed_mesh %}
        {% set cfg = printer["gcode_macro _HOMING_CFG"] %}
        {% set z_move = params.HORIZONTAL_MOVE_Z|default(mesh.horizontal_move_z|default(2.0))|float %}

        # Первая точка сетки: MESH_MIN из параметров -> границы адаптивной сетки -> mesh_min
        {% set fx = mesh.mesh_min[0]|float %}
        {% set fy = mesh.mesh_min[1]|float %}
        {% if params.MESH_MIN is defined %}
            {% set mm = params.MESH_MIN.split(',') %}
            {% if mm|length == 2 %}
                {% set fx = mm[0]|trim|float %}
                {% set fy = mm[1]|trim|float %}
            {% endif %}
        {% elif params.ADAPTIVE|default(0)|int == 1 and printer.exclude_object is defined and printer.exclude_object.objects %}
            # Повторяет set_adaptive_mesh() из bed_mesh.py: min по вершинам полигонов минус margin, не ниже mesh_min
            {% set margin = params.ADAPTIVE_MARGIN|default(mesh.adaptive_margin|default(0.0))|float %}
            {% set ns = namespace(xs=[], ys=[]) %}
            {% for obj in printer.exclude_object.objects %}
                {% for pt in obj.polygon %}
                    {% set ns.xs = ns.xs + [pt[0]|float] %}
                    {% set ns.ys = ns.ys + [pt[1]|float] %}
                {% endfor %}
            {% endfor %}
            {% if ns.xs|length > 0 %}
                {% set fx = [ns.xs|min - margin, mesh.mesh_min[0]|float]|max %}
                {% set fy = [ns.ys|min - margin, mesh.mesh_min[1]|float]|max %}
            {% endif %}
        {% endif %}

        G90
        G0 Z{z_move} F{cfg.z_hop_speed * 60}
        G0 X{fx} Y{fy} F{cfg.travel_speed * 60}
        G4 P{cfg.z_settle_ms}                ; затухание вибраций портала перед тарой CS1237
    {% endif %}
    _BED_MESH_CALIBRATE_BASE {rawparams}

[gcode_macro PROBE]
rename_existing: _PROBE_BASE
description: PROBE с термозащитой сопла
gcode:
    _PROBE_TEMP_GUARD
    _PROBE_BASE {rawparams}

[gcode_macro PROBE_ACCURACY]
rename_existing: _PROBE_ACCURACY_BASE
description: PROBE_ACCURACY с термозащитой сопла
gcode:
    _PROBE_TEMP_GUARD
    _PROBE_ACCURACY_BASE {rawparams}

[gcode_macro PROBE_CALIBRATE]
rename_existing: _PROBE_CALIBRATE_BASE
description: PROBE_CALIBRATE с термозащитой сопла
gcode:
    _PROBE_TEMP_GUARD
    _PROBE_CALIBRATE_BASE {rawparams}

[gcode_macro LOAD_CELL_TEST_TAP]
rename_existing: _LOAD_CELL_TEST_TAP_BASE
description: LOAD_CELL_TEST_TAP с термозащитой сопла
gcode:
    _PROBE_TEMP_GUARD
    _LOAD_CELL_TEST_TAP_BASE {rawparams}

[gcode_macro TEST_CORNERS_ACCURACY]
description: Проверка PROBE_ACCURACY (10 тапов) по углам сетки и у заднего винта Z
gcode:
    {% set mesh = printer.configfile.settings.bed_mesh %}
    {% set min_x = mesh.mesh_min[0]|float %}
    {% set min_y = mesh.mesh_min[1]|float %}
    {% set max_x = mesh.mesh_max[0]|float %}
    {% set max_y = mesh.mesh_max[1]|float %}
    {% set zref_x = mesh.zero_reference_position[0]|float %}
    {% set zref_y = mesh.zero_reference_position[1]|float %}

    {% set samples = params.SAMPLES|default(10)|int %}
    {% set z_hop = params.Z_HOP|default(mesh.horizontal_move_z|default(2.0))|float %}
    {% set travel_speed = (mesh.speed|default(250)|float) * 60 %}
    {% set z_speed = (printer["gcode_macro _HOMING_CFG"].z_hop_speed|default(10)|float) * 60 %}

    # 1. Парковка (если не сделана) или проверка температуры сопла (один раз перед серией)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_respond_info("Оси не запаркованы — выполняю G28...") }
        G28
    {% else %}
        _PROBE_TEMP_GUARD
    {% endif %}

    # 2. Точки замера: 4 угла по границам [bed_mesh] + точка у заднего центрального винта Z
    {% set points = [
        (min_x,  min_y, "1/5: Передний левый угол (у левого винта Z)"),
        (max_x,  min_y, "2/5: Передний правый угол (у правого винта Z)"),
        (max_x,  max_y, "3/5: Задний правый угол (консоль рамы стола)"),
        (min_x,  max_y, "4/5: Задний левый угол (консоль рамы стола)"),
        (zref_x, max_y, "5/5: Задний центральный ходовой винт Z")
    ] %}

    { action_respond_info("=== Старт PROBE_ACCURACY (%d точек по %d касаний) ===" % (points|length, samples)) }

    G90
    {% for x, y, name in points %}
        G0 Z{z_hop} F{z_speed}
        G0 X{x} Y{y} F{travel_speed}
        G4 P400                              ; 400 мс на затухание вибраций и стабилизацию ФВЧ 0.8 Гц
        M118 --> Точка {name} [X={x}, Y={y}]
        _PROBE_ACCURACY_BASE SAMPLES={samples}
    {% endfor %}    

    # 3. Возврат в zero_reference_position на безопасную высоту
    G0 Z{printer["gcode_macro _HOMING_CFG"].z_after_home|default(10)} F{z_speed}
    G0 X{zref_x} Y{zref_y} F{travel_speed}
    { action_respond_info("=== Тест кучности завершён ===") }