# =============================================================================
#  Парковка: X/Y — бездатчиковая (StallGuard4 TMC2209, нативно, без плагинов),
#  Z — тап датчиком нагрузки CS1237 через probe:z_virtual_endstop.
#  Порог StallGuard (driver_SGTHRS) и homing_speed — hw/steppers.cfg.
#  Точка парковки Z — zero_reference_position в hw/bed.cfg.
#  Все числа хоуминга — только в _HOMING_CFG.
# =============================================================================

[force_move]
enable_force_move: True              # нужен для SET_KINEMATIC_POSITION

# -----------------------------------------------------------------------------
# Параметры хоуминга. home_current связан с driver_SGTHRS и homing_speed
# (hw/steppers.cfg): изменили одно из трёх — подбирайте порог заново.
# -----------------------------------------------------------------------------
[gcode_macro _HOMING_CFG]
description: Параметры хоуминга (только переменные)
variable_home_current: 0.80          # А, ток X/Y на время бездатчиковой парковки
variable_stall_clear_ms: 2000        # покой перед G28 X/Y: сброс флага срыва (TMC_Drivers.md)
variable_xy_retract: 10              # мм, отъезд от упора после G28 X/Y
variable_xy_retract_speed: 30        # мм/с
variable_z_hop: 5                    # мм, отвод стола перед движением по XY
variable_z_hop_speed: 10             # мм/с, отвод стола и подъём после G28 Z
variable_travel_speed: 150           # мм/с, переезд к точке парковки Z
variable_z_settle_ms: 300            # затухание вибраций портала перед тарой CS1237
variable_z_after_home: 10            # мм, высота стола после G28 Z
gcode:

# -----------------------------------------------------------------------------
# Возврат рабочего тока X/Y. Klipper не умеет «finally»: если G28 упал, ток
# остался бы пониженным (при повторном включении драйвер получает кэш
# регистров). Поэтому макрос вызывается в начале [homing_override] и в конце
# _SENSORLESS_HOME. После сбоя хоуминга его можно вызвать вручную.
# -----------------------------------------------------------------------------
[gcode_macro _RESTORE_RUN_CURRENT]
description: Вернуть рабочий ток X/Y из [tmc2209 stepper_x|y]
gcode:
    {% set run_x = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set run_y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}

# -----------------------------------------------------------------------------
# Бездатчиковая парковка одной оси CoreXY: _SENSORLESS_HOME AXIS=X|Y
# В CoreXY в движении участвуют оба мотора — ток снижается на обоих.
# Отъезд — на токе хоуминга (как в примере TMC_Drivers.md), затем рабочий ток.
# -----------------------------------------------------------------------------
[gcode_macro _SENSORLESS_HOME]
description: Бездатчиковая парковка X или Y на пониженном токе (AXIS=X|Y)
gcode:
    {% set cfg = printer["gcode_macro _HOMING_CFG"] %}
    {% set axis = params.AXIS|default('')|upper %}
    {% if axis not in ['X', 'Y'] %}
        { action_raise_error("_SENSORLESS_HOME: AXIS должен быть X или Y, получено '%s'" % axis) }
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg.home_current}
    G4 P{cfg.stall_clear_ms}
    G28 {axis}
    G91
    G0 {axis}-{cfg.xy_retract} F{cfg.xy_retract_speed * 60}
    G90
    _RESTORE_RUN_CURRENT

[homing_override]
axes: xyz
gcode:
    {% set cfg = printer["gcode_macro _HOMING_CFG"] %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set home_all = ('X' not in params) and ('Y' not in params) and ('Z' not in params) %}
    {% set need_z = home_all or 'Z' in params %}
    {% set need_x = home_all or 'X' in params or (need_z and 'x' not in homed) %}
    {% set need_y = home_all or 'Y' in params or (need_z and 'y' not in homed) %}
    {% set zref = printer.configfile.settings.bed_mesh.zero_reference_position|default(none) if 'bed_mesh' in printer.configfile.settings else none %}
    {% if need_z and zref is none %}
        { action_raise_error("homing_override: нет [bed_mesh] zero_reference_position (hw/bed.cfg)") }
    {% endif %}

    {% set mesh_name = printer.bed_mesh.profile_name|default('') if 'bed_mesh' in printer else '' %}

    # --- Этап 0: гарантированно рабочий ток X/Y (на случай сбоя прошлого хоуминга) ---
    _RESTORE_RUN_CURRENT

    # --- Этап 0.1: снять карту высот на время парковки ---
    # Пока Z не запаркована (CLEAR_HOMED=Z ниже), поправка карты по Z в любом
    # движении XY даёт «Must home axis first». Карта возвращается в конце.
    # Если парковка упала — загрузить вручную: BED_MESH_PROFILE LOAD=<имя>.
    {% if mesh_name %}
        BED_MESH_CLEAR
    {% endif %}

    # --- Этап 1: отвод стола вниз перед любым движением по XY ---
    # SET_HOMED= обязателен: по умолчанию SET_HOMED=XYZ, и CLEAR_HOMED=Z
    # без него пометил бы X и Y запаркованными (force_move.py).
    {% if 'z' not in homed %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G0 Z{cfg.z_hop} F{cfg.z_hop_speed * 60}
        G90
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% elif printer.toolhead.position.z < cfg.z_hop %}
        G90
        G0 Z{cfg.z_hop} F{cfg.z_hop_speed * 60}
    {% endif %}

    # --- Этап 2: X, затем Y (между ними отъезд и пауза — TMC_Drivers.md, CoreXY) ---
    {% if need_x %}
        _SENSORLESS_HOME AXIS=X
    {% endif %}
    {% if need_y %}
        _SENSORLESS_HOME AXIS=Y
    {% endif %}

    # --- Этап 3: Z тапом CS1237 в точке zero_reference_position ---
    {% if need_z %}
        G90
        G0 X{zref[0]} Y{zref[1]} F{cfg.travel_speed * 60}
        _PROBE_TEMP_GUARD                ; сопло не горячее probe_temp + 5 °C
        G4 P{cfg.z_settle_ms}
        G28 Z
        G0 Z{cfg.z_after_home} F{cfg.z_hop_speed * 60}
    {% endif %}

    # --- Этап 4: вернуть карту высот (её ноль = zero_reference_position = точка G28 Z) ---
    {% if mesh_name %}
        {% if mesh_name in printer.bed_mesh.profiles %}
            BED_MESH_PROFILE LOAD="{mesh_name}"
        {% else %}
            { action_respond_info("homing_override: карта '%s' не сохранена в профилях — не восстановлена" % mesh_name) }
        {% endif %}
    {% endif %}
