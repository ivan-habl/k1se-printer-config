# =============================================================================
#  Термокамера: вытяжка [temperature_fan chamber_fan] (hw/fans.cfg)
#
#  Модель «термостат + потолок»:
#    M141 S>0          — цель термостата S °C (потолок скорости не меняется);
#    M141 S0, END_PRINT — защитный режим: цель default_target,
#                        MIN_SPEED=0 MAX_SPEED=1;
#    M106 P1|P3 S>0    — потолок скорости MAX_SPEED=S/255 (MIN_SPEED=0),
#                        цель не меняется (macros/fan_compat.cfg);
#    M106 P1|P3 S0, M107 P1|P3 — защитный режим с ТЕКУЩЕЙ целью: слайсер не
#                        может отключить защиту камеры от перегрева.
#
#  START_PRINT (macros/print.cfg): CHAMBER_TEMP — потолок, M141 S=max(CHAMBER_TEMP,
#  CHAMBER_MIN); M191 S{CHAMBER_MIN} вызывается только при CHAMBER_MIN > 0, после
#  него потолок возвращается повторным M141 (M191 внутри ставит цель на порог).
# =============================================================================

[gcode_macro _CHAMBER_CFG]
description: Параметры термокамеры (единственное место для этих значений)
variable_default_target: 45.0   # цель защитного режима, °C
variable_bed_heat_temp: 105     # температура стола для прогрева камеры в M191, °C
variable_max_wait_target: 70    # выше этой цели M191 не ждёт прогрева, °C
gcode:

# --- Цель по умолчанию при старте Klipper (target_temp в секции не задан) ----
[delayed_gcode _CHAMBER_INIT]
initial_duration: 1
gcode:
    M141 S0

[gcode_macro M141]
description: Цель термокамеры (S>0 — термостат на S °C, S0 — защитный режим)
gcode:
    {% set cfg = printer["gcode_macro _CHAMBER_CFG"] %}
    {% set S = params.S|default(0)|float %}
    {% if S > 0 %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={S}
    {% else %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={cfg.default_target} MIN_SPEED=0 MAX_SPEED=1
    {% endif %}

# -----------------------------------------------------------------------------
# M191 — ожидание прогрева камеры за счёт стола. Стол временно греется до
# max(текущая цель, bed_heat_temp), после прогрева возвращается к исходной
# цели (шаблон рендерится до выполнения, bed_t — значение на момент вызова).
# -----------------------------------------------------------------------------
[gcode_macro M191]
description: Ожидание прогрева термокамеры за счёт стола
gcode:
    {% set cfg = printer["gcode_macro _CHAMBER_CFG"] %}
    {% set s = params.S|default(0)|float %}
    {% set bed_t = printer.heater_bed.target|float %}
    {% set chamber_temp = printer["temperature_fan chamber_fan"].temperature|float %}
    {% if s > 0 %}
        M141 S{s}
        {% if s > cfg.max_wait_target %}
            RESPOND TYPE=command MSG="M191: цель {s}°C выше {cfg.max_wait_target}°C, ожидание прогрева камеры пропущено"
        {% elif s > chamber_temp %}
            {% set heat_t = [bed_t, cfg.bed_heat_temp]|max %}
            M140 S{heat_t}
            RESPOND TYPE=command MSG="Прогрев термокамеры столом до {s}°C..."
            TEMPERATURE_WAIT SENSOR="temperature_fan chamber_fan" MINIMUM={s - 1.0}
            M140 S{bed_t}
            RESPOND TYPE=command MSG="Целевая температура камеры достигнута: {s}°C, стол возвращён к {bed_t}°C"
        {% endif %}
    {% endif %}
