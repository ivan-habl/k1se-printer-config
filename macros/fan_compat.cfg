# =============================================================================
#  Совместимость M106/M107 со слайсерами (OrcaSlicer / Creality Print)
#    P0 — обдув модели ([fan])
#    P1 — вытяжка камеры: S>0 задаёт потолок скорости, S0 = защитный режим
#    P2 — боковой обдув ([fan_generic aux_fan], если раскомментирован)
#    P3 — псевдоним P1 (так вытяжкой управляет OrcaSlicer)
#  Логика вытяжки («термостат + потолок») описана в macros/chamber.cfg.
#  Штатные команды переименованы в M106.1/M107.1: Klipper разрешает
#  rename_existing классической G-команды (буква + число) только в имя того же
#  типа, вариант M106_BASE даёт «rename of different types».
# =============================================================================

[gcode_macro M106]
rename_existing: M106.1
description: Вентиляторы по индексу P (P0 обдув, P1/P3 потолок вытяжки камеры, P2 aux)
gcode:
    {% set S = params.S|default(255)|int %}
    {% set P = params.P|default(0)|int %}
    {% set speed = [S / 255.0, 1.0]|min|round(3) %}

    {% if P == 0 %}
        M106.1 S{S}
    {% elif P == 1 or P == 3 %}
        {% if S > 0 %}
            {% set target = printer["temperature_fan chamber_fan"].target|float %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={target} MIN_SPEED=0 MAX_SPEED={speed}
        {% else %}
            M107 P{P}
        {% endif %}
    {% elif P == 2 %}
        {% if 'fan_generic aux_fan' in printer.configfile.settings %}
            SET_FAN_SPEED FAN=aux_fan SPEED={speed}
        {% endif %}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
description: Выключение вентиляторов (вытяжка камеры — в защитный режим)
gcode:
    {% set target = printer["temperature_fan chamber_fan"].target|float %}
    {% if 'P' in params %}
        {% set P = params.P|int %}
        {% if P == 0 %}
            M107.1
        {% elif P == 1 or P == 3 %}
            SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={target} MIN_SPEED=0 MAX_SPEED=1
        {% elif P == 2 %}
            {% if 'fan_generic aux_fan' in printer.configfile.settings %}
                SET_FAN_SPEED FAN=aux_fan SPEED=0.0
            {% endif %}
        {% endif %}
    {% else %}
        M107.1
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={target} MIN_SPEED=0 MAX_SPEED=1
        {% if 'fan_generic aux_fan' in printer.configfile.settings %}
            SET_FAN_SPEED FAN=aux_fan SPEED=0.0
        {% endif %}
    {% endif %}
