# =============================================================================
#  Печать: сервисные модули, интеграция с Fluidd, START_PRINT / END_PRINT
#  [virtual_sdcard], [pause_resume], [display_status], [respond] — в fluidd.cfg.
# =============================================================================

[idle_timeout]
timeout: 3600

[save_variables]
filename: ~/printer_data/config/variables.cfg

[gcode_arcs]
resolution: 0.5

[exclude_object]

[skew_correction]

# --- Конфигурация штатных макросов PAUSE / RESUME / CANCEL_PRINT (fluidd.cfg) -
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 220.0
variable_custom_park_y    : 220.0
variable_custom_park_dz   : 5.0
variable_retract          : 1.5
variable_cancel_retract   : 2.0
variable_speed_retract    : 35.0
variable_unretract        : 1.5
variable_speed_unretract  : 25.0
variable_speed_hop        : 10.0
variable_speed_move       : 150.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 220.0
variable_park_at_cancel_y : 220.0
variable_user_cancel_macro: "_USER_CANCEL"
gcode:

# --- Вызывается из CANCEL_PRINT (fluidd.cfg) через user_cancel_macro ---------
[gcode_macro _USER_CANCEL]
description: Сброс перекоса, лимитов скорости, PA и вытяжки камеры при отмене печати
gcode:
    SET_SKEW CLEAR=1
    _RESET_MOTION_STATE
    M141 S0

# -----------------------------------------------------------------------------
# Возврат лимитов скорости и PA к значениям конфига. SET_VELOCITY_LIMIT и
# SET_PRESSURE_ADVANCE из G-code слайсера действуют до RESTART и сами не
# откатываются. Источник значений — printer.configfile.settings (значения
# из конфига), а не toolhead/extruder status: тот отдаёт ТЕКУЩИЕ значения,
# то есть уже изменённые слайсером. Значения приводятся |float, на случай
# отсутствия ключа заданы умолчания Klipper.
# Вызывается: START_PRINT (шаг 1), END_PRINT, _USER_CANCEL.
# -----------------------------------------------------------------------------
[gcode_macro _RESET_MOTION_STATE]
description: Вернуть лимиты скорости и PA к значениям из конфига
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set prn = cfg.printer %}
    {% set ext = cfg.extruder %}
    SET_VELOCITY_LIMIT VELOCITY={prn.max_velocity|float} ACCEL={prn.max_accel|float} SQUARE_CORNER_VELOCITY={prn.square_corner_velocity|default(5.0)|float} MINIMUM_CRUISE_RATIO={prn.minimum_cruise_ratio|default(0.5)|float}
    SET_PRESSURE_ADVANCE ADVANCE={ext.pressure_advance|default(0.0)|float} SMOOTH_TIME={ext.pressure_advance_smooth_time|default(0.040)|float}

# -----------------------------------------------------------------------------
# Параметры адаптивной линии очистки. Все числа — только здесь.
#   bed_*          физический стол (не mesh_min/max и не position_max):
#                  границы, за которые линия не выходит
#   edge_margin    мм, отступ линии от края стола
#   purge_margin   мм, зазор между линией и ближайшей точкой полигона модели
#   length         мм, желаемая длина линии; min_length — минимально допустимая
#   e_per_mm       мм прутка на мм линии (0.15 = 12 мм на 80 мм)
#   height         мм, высота сопла при очистке
#   speed          мм/с, скорость линии; wipe — мм движения без экструзии после
#   fallback_*     линия вдоль X, если EXCLUDE_OBJECT_DEFINE не вызывался
# Скорости переездов — travel_speed и z_hop_speed из _HOMING_CFG.
# -----------------------------------------------------------------------------
[gcode_macro _PURGE_CFG]
description: Параметры линии очистки (только переменные)
variable_bed_min_x: 0
variable_bed_min_y: 0
variable_bed_max_x: 220
variable_bed_max_y: 220
variable_edge_margin: 3
variable_purge_margin: 8
variable_length: 80
variable_min_length: 30
variable_e_per_mm: 0.312   # было 0.15; поток ~15 мм³/с при 20 мм/с
variable_height: 0.3
variable_speed: 20
variable_wipe: 5
variable_fallback_x: 5
variable_fallback_y: 5
gcode:

# -----------------------------------------------------------------------------
# Адаптивная линия очистки по bbox полигонов EXCLUDE_OBJECT_DEFINE.
# Кандидаты по порядку: спереди, слева, сзади, справа — первый подходящий
# (доступная длина вдоль края >= min_length). Ничего не подошло — линия
# пропускается с сообщением (стол занят целиком: включите в Orca юбку).
# Объектов нет — прежняя фиксированная линия от fallback_x/y вдоль X.
# Ожидает G90 + M83 и нулевой E (задаёт START_PRINT).
# -----------------------------------------------------------------------------
[gcode_macro _ADAPTIVE_PURGE]
description: Линия очистки сопла рядом с моделью (по полигонам exclude_object)
gcode:
    {% set c = printer["gcode_macro _PURGE_CFG"] %}
    {% set h = printer["gcode_macro _HOMING_CFG"] %}
    {% set lo_x = c.bed_min_x|float + c.edge_margin|float %}
    {% set hi_x = c.bed_max_x|float - c.edge_margin|float %}
    {% set lo_y = c.bed_min_y|float + c.edge_margin|float %}
    {% set hi_y = c.bed_max_y|float - c.edge_margin|float %}
    {% set ns = namespace(xs=[], ys=[], found=false, ax='X', fixed=0.0, a0=0.0, a1=0.0) %}
    {% if printer.exclude_object is defined and printer.exclude_object.objects %}
        {% for obj in printer.exclude_object.objects %}
            {% for pt in obj.polygon %}
                {% set ns.xs = ns.xs + [pt[0]|float] %}
                {% set ns.ys = ns.ys + [pt[1]|float] %}
            {% endfor %}
        {% endfor %}
    {% endif %}

    {% if ns.xs|length == 0 %}
        # Объектов нет (exclude object выключен в слайсере): фиксированная линия
        {% set ns.found = true %}
        {% set ns.ax = 'X' %}
        {% set ns.fixed = c.fallback_y|float %}
        {% set ns.a0 = c.fallback_x|float %}
        {% set ns.a1 = ns.a0 + c.length|float %}
    {% else %}
        {% set min_x = ns.xs|min %}
        {% set max_x = ns.xs|max %}
        {% set min_y = ns.ys|min %}
        {% set max_y = ns.ys|max %}
        {% set m = c.purge_margin|float %}
        {% set need = c.min_length|float %}

        # 1. Спереди: линия вдоль X на y = min_y - margin
        {% set y = min_y - m %}
        {% set a0 = [min_x, lo_x]|max %}
        {% set a1 = [a0 + c.length|float, hi_x]|min %}
        {% if not ns.found and y >= lo_y and a1 - a0 >= need %}
            {% set ns.found = true %}
            {% set ns.ax = 'X' %}
            {% set ns.fixed = y %}
            {% set ns.a0 = a0 %}
            {% set ns.a1 = a1 %}
        {% endif %}

        # 2. Слева: линия вдоль Y на x = min_x - margin
        {% set x = min_x - m %}
        {% set a0 = [min_y, lo_y]|max %}
        {% set a1 = [a0 + c.length|float, hi_y]|min %}
        {% if not ns.found and x >= lo_x and a1 - a0 >= need %}
            {% set ns.found = true %}
            {% set ns.ax = 'Y' %}
            {% set ns.fixed = x %}
            {% set ns.a0 = a0 %}
            {% set ns.a1 = a1 %}
        {% endif %}

        # 3. Сзади: линия вдоль X на y = max_y + margin
        {% set y = max_y + m %}
        {% set a0 = [min_x, lo_x]|max %}
        {% set a1 = [a0 + c.length|float, hi_x]|min %}
        {% if not ns.found and y <= hi_y and a1 - a0 >= need %}
            {% set ns.found = true %}
            {% set ns.ax = 'X' %}
            {% set ns.fixed = y %}
            {% set ns.a0 = a0 %}
            {% set ns.a1 = a1 %}
        {% endif %}

        # 4. Справа: линия вдоль Y на x = max_x + margin
        {% set x = max_x + m %}
        {% set a0 = [min_y, lo_y]|max %}
        {% set a1 = [a0 + c.length|float, hi_y]|min %}
        {% if not ns.found and x <= hi_x and a1 - a0 >= need %}
            {% set ns.found = true %}
            {% set ns.ax = 'Y' %}
            {% set ns.fixed = x %}
            {% set ns.a0 = a0 %}
            {% set ns.a1 = a1 %}
        {% endif %}
    {% endif %}

    {% if not ns.found %}
        RESPOND TYPE=error MSG="_ADAPTIVE_PURGE: нет места для линии очистки, пропущена (включите юбку в слайсере)"
    {% else %}
        {% set len = ns.a1 - ns.a0 %}
        {% set e = len * c.e_per_mm|float %}
        {% set dir = 1.0 if ns.a1 >= ns.a0 else -1.0 %}
        {% set a_wipe = ns.a1 + dir * c.wipe|float %}
        {% set a_wipe = [[a_wipe, (lo_x if ns.ax == 'X' else lo_y)]|max, (hi_x if ns.ax == 'X' else hi_y)]|min %}
        {% set fx0 = ns.a0 if ns.ax == 'X' else ns.fixed %}
        {% set fy0 = ns.fixed if ns.ax == 'X' else ns.a0 %}
        {% set fx1 = ns.a1 if ns.ax == 'X' else ns.fixed %}
        {% set fy1 = ns.fixed if ns.ax == 'X' else ns.a1 %}
        {% set wx = a_wipe if ns.ax == 'X' else ns.fixed %}
        {% set wy = ns.fixed if ns.ax == 'X' else a_wipe %}
        G90
        G0 X{'%.2f' % fx0} Y{'%.2f' % fy0} F{h.travel_speed * 60}
        G0 Z{c.height} F{h.z_hop_speed * 60}
        G1 X{'%.2f' % fx1} Y{'%.2f' % fy1} E{'%.3f' % e} F{c.speed * 60}
        G1 X{'%.2f' % wx} Y{'%.2f' % wy} F{h.travel_speed * 60}
        G0 Z1.0 F{h.z_hop_speed * 60}
    {% endif %}

[gcode_macro _PARK]
description: Безопасная парковка головы у правого заднего угла
gcode:
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set z_safe = [act_z + 5.0, max_z]|min %}
    G90
    G0 Z{z_safe} F600
    G0 X{max_x - 5} Y{max_y - 5} F9000

# -----------------------------------------------------------------------------
# START_PRINT — поддерживает оба формата аргументов из слайсеров:
#   START_PRINT BED_TEMP=60 EXTRUDER_TEMP=220 CHAMBER_TEMP=45 CHAMBER_MIN=0 SOAK=0
#   START_PRINT BED=60 EXTRUDER=220 CHAMBER=45 CHAMBER_MIN=0 SOAK=0
# Камера задаётся двумя независимыми параметрами:
#   CHAMBER_TEMP (CHAMBER)  — потолок: цель термостата вытяжки (M141), °C;
#                             0 — оставить защитный режим (цель по умолчанию);
#   CHAMBER_MIN             — порог ожидания: пока камера холоднее, стол греется
#                             (M191), °C; 0/нет — не ждать и не греть стол до 105 °C.
# Потолок, которому не задан порог, только ставит цель вытяжки. Старый вызов с
# CHAMBER_TEMP=N без CHAMBER_MIN теперь не ждёт прогрева (намеренно).
# Вызов из Orca (machine_start_gcode):
#   START_PRINT BED_TEMP=[bed_temperature_initial_layer_single]
#     EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
#     CHAMBER_TEMP=[chamber_temperature]
#     CHAMBER_MIN={chamber_minimal_temperature[initial_extruder]}
#     PA={pressure_advance[initial_extruder]}      (одной строкой)
# Необязательный PA=<значение> — PA филамента для линии очистки (0/нет = из конфига).
# MESH_MIN / MESH_MAX игнорируются: сетка строится по полигонам EXCLUDE_OBJECT_DEFINE.
# Температура сопла для пробы берётся из _PROBE_TEMP_GUARD (macros/probe.cfg).
# -----------------------------------------------------------------------------
[gcode_macro START_PRINT]
description: Старт печати с термозащитой CS1237 и нативным адаптивным мешем
gcode:
    {% set BED = params.BED_TEMP|default(params.BED|default(60))|float %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(220))|float %}
    {% set CHAMBER = params.CHAMBER_TEMP|default(params.CHAMBER|default(0))|float %}
    {% set CHAMBER_MIN = params.CHAMBER_MIN|default(0)|float %}
    {% set CEIL = [CHAMBER, CHAMBER_MIN]|max %}
    {% set SOAK = params.SOAK|default(0)|int %}
    {% set PA = params.PA|default(0)|float %}
    {% set PROBE_TEMP = printer["gcode_macro _PROBE_TEMP_GUARD"].probe_temp|float %}

    # 1. Сброс состояния предыдущей печати (включая лимиты скорости и PA)
    SET_SKEW CLEAR=1
    _RESET_MOTION_STATE
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0

    M117 Подготовка и разогрев...
    # 2. Нагрев стола, безопасный прогрев сопла (пластик не течёт), потолок
    #    камеры = max(CHAMBER_TEMP, CHAMBER_MIN). Ноль — защитный режим
    #    (его задают _CHAMBER_INIT и END_PRINT).
    M140 S{BED}
    M104 S{PROBE_TEMP}
    {% if CEIL > 0 %}
        M141 S{CEIL}
    {% endif %}

    # 3. Первичная парковка осей
    G28

    # 4. Прогрев стола и (только при CHAMBER_MIN > 0) камеры. M191 греет камеру
    #    столом и возвращает стол к прежней цели; внутри он вызывает M141 S с
    #    порогом, поэтому потолок возвращается повторным M141 (S = CEIL).
    #    Повторный M190 дожидается стабилизации на BED.
    M190 S{BED}
    {% if CHAMBER_MIN > 0 %}
        M191 S{CHAMBER_MIN}
        M141 S{CEIL}
        M190 S{BED}
    {% endif %}

    # 5. Тепловая выдержка стола
    {% if SOAK > 0 %}
        M117 Тепловая стабилизация стола ({SOAK} с)...
        G4 P{SOAK * 1000}
    {% endif %}

    # 6. Сопло на температуре пробы
    M109 S{PROBE_TEMP}

    # 7. Точный перехоуминг Z на прогретом столе, адаптивная сетка, перекос XY
    M117 Калибровка сетки стола...
    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    SKEW_PROFILE LOAD=habl_profile

    # 8. Догрев сопла до рабочей температуры печати в углу стола (подтёки
    #    пластика не попадают на область модели). Z поднят до переезда.
    G90
    G0 Z10 F{printer["gcode_macro _HOMING_CFG"].z_hop_speed * 60}
    G0 X5 Y5 F{printer["gcode_macro _HOMING_CFG"].travel_speed * 60}
    M117 Нагрев сопла до {EXTRUDER|int} °C...
    M109 S{EXTRUDER}

    # 9. Режим координат и экструдера задаётся явно: gcode_move между печатями
    #    не сбрасывается, а Orca выдаёт G90/M83 только ПОСЛЕ START_PRINT.
    #    PA филамента применяется до очистки, иначе она идёт с PA прошлой печати.
    G90
    M83
    {% if PA > 0 %}
        SET_PRESSURE_ADVANCE ADVANCE={PA}
    {% endif %}

    # 10. Линия очистки сопла (адаптивная, см. _ADAPTIVE_PURGE)
    M117 Очистка сопла...
    G92 E0
    _ADAPTIVE_PURGE
    G92 E0
    M117 Печать...

# -----------------------------------------------------------------------------
# END_PRINT — корректное завершение печати и сброс профилей
# M141 S0 возвращает вытяжку в защитный режим с целью по умолчанию.
# -----------------------------------------------------------------------------
[gcode_macro END_PRINT]
description: Завершение печати
gcode:
    M400
    _RESET_MOTION_STATE
    G92 E0
    G1 E-2.0 F2100
    _PARK
    SET_SKEW CLEAR=1
    TURN_OFF_HEATERS
    M107
    M141 S0
    M84
    M117 Готово
