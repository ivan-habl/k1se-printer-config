# =============================================================================
#  Сервисные макросы загрузки/выгрузки филамента для экструдера DXC
# =============================================================================

[gcode_macro LOAD_FILAMENT]
description: Заправка филамента (сопло 240 °C)
gcode:
    {% set TEMP = params.TEMP|default(240)|float %}
    M109 S{TEMP}
    G91
    G1 E50 F300
    G1 E30 F150
    G90
    M400
    M117 Филамент заправлен

[gcode_macro UNLOAD_FILAMENT]
description: Извлечение филамента (сопло 240 °C)
gcode:
    {% set TEMP = params.TEMP|default(240)|float %}
    M109 S{TEMP}
    G91
    G1 E10 F300
    G1 E-80 F600
    G90
    M400
    M117 Филамент извлечён
