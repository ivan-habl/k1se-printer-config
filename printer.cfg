# =============================================================================
#  Creality K1 SE — Klipper master + PR #7369 (GD32F303), Katapult + PR #191
#  Архитектура: Split-Host
#    host       : Orange Pi Zero 3 (aarch64, Armbian), без Linux MCU
#    [mcu]      : CR4CU220812S12 / GD32F303RET6 — Bluepill UART1 (if00) + CS1237
#    nozzle_mcu : K1-NOZZLE-M_V12 / GD32F303CBT6 — Bluepill UART3 (if04)
#
#  Оба MCU сообщают MCU=gd32f303 (120 МГц). Хост ~/klipper — единый worktree:
#  master + PR #7369, отслеживаемые файлы не изменены (git status чистый).
#  temperature_mcu на gd32f303 — оверлей ext/temperature_mcu_gd32.py (секция
#  [temperature_mcu_gd32] ниже; ставится один раз через ext/install.sh,
#  переживает git pull/rebase). Обновление Klipper — rebase worktree и
#  обязательная перепрошивка ОБОИХ MCU.
#
#  В этом файле лежит всё, во что пишет SAVE_CONFIG ([input_shaper],
#  z_offset, PID, калибровка датчика нагрузки, skew), иначе SAVE_CONFIG
#  откажет с ошибкой «conflicts with included value».
# =============================================================================

[include fluidd.cfg]
[include hw/steppers.cfg]
[include hw/extruder.cfg]
[include hw/bed.cfg]
[include hw/load_cell.cfg]
[include hw/fans.cfg]
[include hw/sensors.cfg]
[include hw/resonance.cfg]
[include hw/lighting.cfg]
[include macros/print.cfg]
[include macros/homing.cfg]
[include macros/probe.cfg]
[include macros/chamber.cfg]
[include macros/fan_compat.cfg]
[include macros/filament.cfg]

# -----------------------------------------------------------------------------
# Микроконтроллеры
# -----------------------------------------------------------------------------
[mcu]
serial: /dev/serial/by-id/usb-R2AXZ_Kirill_Kotyagin_Bluepill_Serial_Monster_1319030132124353354B4E00-if00
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-R2AXZ_Kirill_Kotyagin_Bluepill_Serial_Monster_1319030132124353354B4E00-if04
baud: 230400
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

# Калибровка temperature_mcu для gd32f303 (ext/temperature_mcu_gd32.py)
[temperature_mcu_gd32]

# -----------------------------------------------------------------------------
# Кинематика CoreXY
# -----------------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
minimum_cruise_ratio: 0.5
square_corner_velocity: 10.0
max_z_velocity: 20
max_z_accel: 300

# -----------------------------------------------------------------------------
# Input Shaper — здесь, а не во включаемом файле: SHAPER_CALIBRATE -> SAVE_CONFIG
# -----------------------------------------------------------------------------
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 55.8
shaper_type_y: mzv
shaper_freq_y: 56.6

# -----------------------------------------------------------------------------
# Датчик нагрузки: обязательный z_offset. Остальные параметры — hw/load_cell.cfg.
# Заглушка должна быть именно в printer.cfg: после PROBE_CALIBRATE команда
# SAVE_CONFIG сама закомментирует эту строку и запишет значение в блок ниже.
# -----------------------------------------------------------------------------
[load_cell_probe]
#z_offset: 0.0      # временно, до PROBE_CALIBRATE

