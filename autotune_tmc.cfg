# =============================================================================
#  klipper_tmc_autotune — ВСЕ секции [autotune_tmc ...] только здесь
#  (конвенция KIAUH: удаление расширения убирает [include autotune_tmc.cfg],
#  секции в других файлах остались бы и сломали бы запуск Klipper).
#  При установке через KIAUH на вопрос о создании примера отвечать «No»
#  и следить, чтобы [include autotune_tmc.cfg] в printer.cfg был один.
#  Проверка: в klippy.log при старте строки «autotune_tmc set stepper_x ...».
# =============================================================================

# --- X / Y: K1C & K1SE A/B, sensorless homing (sg4_thrs читается отсюда) ----
[autotune_tmc stepper_x]
motor: bj42d29-30v00
tuning_goal: performance
voltage: 24.0
tbl: 2
sg4_thrs: 150

[autotune_tmc stepper_y]
motor: bj42d29-30v00
tuning_goal: performance
voltage: 24.0
tbl: 2
sg4_thrs: 150

# --- Z: K1C & K1SE Z (gear_ratio autotune не учитывает, при Z <= 20 мм/с некритично)
# Сравнить silent и performance по PROBE_ACCURACY после ввода в эксплуатацию.
[autotune_tmc stepper_z]
motor: bj42d22-44v26
tuning_goal: performance
voltage: 24.0
tbl: 2
sg4_thrs: 0

# --- Экструдер: auto = performance (SpreadCycle) для этого мотора ------------
[autotune_tmc extruder]
motor: moons-cse14hra2l410a
tuning_goal: auto
voltage: 24.0
tbl: 2
