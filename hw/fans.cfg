# =============================================================================
#  Вентиляторы (No Duplicate Pin Overrides: один физический пин = один объект)
#  Управление из слайсера (M106/M107) — macros/fan_compat.cfg,
#  термокамера (M141/M191) — macros/chamber.cfg.
# =============================================================================

# --- Обдув детали (Part Cooling Fan на плате головы) -------------------------
[fan]
pin: !nozzle_mcu:PB8
enable_pin: nozzle_mcu:PB6
tachometer_pin: ^nozzle_mcu:PB3
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
kick_start_time: 0.100
off_below: 0.083

# --- Вентилятор радиатора хотэнда (Hotend Fan) -------------------------------
[heater_fan hotend_fan]
pin: nozzle_mcu:PB5
tachometer_pin: ^nozzle_mcu:PB4
heater: extruder
heater_temp: 40.0
fan_speed: 1.0

# --- Вытяжной вентилятор термокамеры + датчик температуры камеры -------------
# Модель «термостат + потолок»: цель задаёт M141, потолок скорости — M106 P1|P3.
# target_temp здесь не задан: цель по умолчанию хранится в одном месте
# (_CHAMBER_CFG variable_default_target) и выставляется при старте
# [delayed_gcode _CHAMBER_INIT] в macros/chamber.cfg.
[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.010
kick_start_time: 0.100
off_below: 0.10
hardware_pwm: False
max_power: 1.0
shutdown_speed: 0.0
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC5
min_temp: 0
max_temp: 75
control: pid
pid_Kp: 2.0
pid_Ki: 3.5
pid_Kd: 0.5
pid_deriv_time: 2.0
max_speed: 1.0
min_speed: 0.0

# --- Охлаждение материнской платы + внутренний датчик температуры [mcu] ------
# temperature_mcu на GD32F303 требует [temperature_mcu_gd32]
# (ext/temperature_mcu_gd32.py; калибровка типовая, по даташиту).
# Точная подстройка — sensor_temperature1/sensor_adc1 в этой секции.
[temperature_fan mcu_fan]
pin: PB2
tachometer_pin: ^PC6
kick_start_time: 0.050
cycle_time: 0.010
hardware_pwm: False
shutdown_speed: 0.0
max_power: 1.0
off_below: 0.15
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100
control: pid
pid_Kp: 35.0
pid_Ki: 1.0
pid_Kd: 5.0
pid_deriv_time: 2.5
target_temp: 46.0
max_speed: 1.0
min_speed: 0.0

