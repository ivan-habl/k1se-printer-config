# =============================================================================
#  Нагреватель стола (основная плата, GD32F303RET6) и карта высот
#  ВАЖНО: управление строго по PID (значения в SAVE_CONFIG файла printer.cfg),
#  чтобы исключить тепловое «дыхание» стола на тензомосте CS1237.
# =============================================================================

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 115
# Коэффициенты PID — только в блоке SAVE_CONFIG внизу printer.cfg

[verify_heater heater_bed]
max_error: 120
check_gain_time: 120
hysteresis: 10
heating_gain: 1.0

# -----------------------------------------------------------------------------
# Карта высот (нативный адаптивный режим BED_MESH_CALIBRATE ADAPTIVE=1)
# zero_reference_position — единственный источник точки G28 Z, её читает [homing_override] (macros/homing.cfg).
# Если она не попадает в адаптивную сетку, Klipper допробует её сам и уберёт
# смещение между G28 Z и сеткой.
# -----------------------------------------------------------------------------
[bed_mesh]
speed: 250
horizontal_move_z: 2.0
mesh_min: 10, 10
mesh_max: 215, 215
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
adaptive_margin: 5
fade_start: 1.0
fade_end: 10.0
split_delta_z: 0.015
move_check_distance: 3.0
zero_reference_position: 114.5, 113
