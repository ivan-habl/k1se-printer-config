# =============================================================================
#  Тензо-автоуровень: Chipsea CS1237 на основном MCU (GD32F303RET6)
#  Подключение: DOUT -> PB4, SCLK -> PB3 (колодка 4-го драйвера).
#  Подтяжку на DOUT задать в конфиге нельзя: cs1237.py не принимает «^»
#  (ошибка Invalid pin description), а прошивка настраивает пин без подтяжки.
#  Если подтяжка нужна — внешний резистор 10k на 3.3 В.
#  Логометрическое питание моста и REFIN от 3.3 В (Z431B удалён, R1 = 3.3 Ом,
#  R5 разомкнут) -> reference_output: False
#
#  PB3 (JTDO) и PB4 (NJTRST) свободны: прошивка Klipper (stm32f1.c ->
#  armcm_main, в т.ч. сборка MACH_GD32F303 из PR #7369) сама отключает JTAG
#  при старте. Отдельный патч прошивки не нужен.
#
#  z_offset: заглушка в printer.cfg (обязательный параметр), реальное значение
#  пишет PROBE_CALIBRATE -> SAVE_CONFIG. counts_per_gram и
#  reference_tare_counts пишет LOAD_CELL_CALIBRATE -> SAVE_CONFIG. Пока датчик
#  не откалиброван, любой G28 Z завершится ошибкой «Load Cell not calibrated».
#
#  Если при нажатии на стол сила отрицательная — раскомментировать
#  sensor_orientation: inverted ниже.
#
#  Защита покрытия от горячего сопла (бывший activate_gcode, который
#  [load_cell_probe] не читает) — макрос _PROBE_TEMP_GUARD в macros/probe.cfg.
# =============================================================================

[load_cell_probe]
sensor_type: cs1237
dout_pin: PB4
sclk_pin: PB3
sample_rate: 640                     # 1.56 мс на отсчёт, частота Найквиста 320 Гц
gain: 128
reference_output: False              # внешняя логометрическая опора от 3.3 В
#sensor_orientation: inverted

# --- Пороги безопасности и срабатывания ---
force_safety_limit: 2000             # ±2000 г от тары: аварийная остановка
trigger_force: 65                    # усилие срабатывания триггера касания, г

# --- Профиль зондирования и кусочно-линейной интерполяции (Single-MCU Homing) ---
speed: 2.5                           # скорость подвода (2.5 мм/с = 3.9 мкм/отсчёт)
lift_speed: 2.5                      # 2.5 мм/с даёт 12–15 точек за 300 мс отрыва для регрессии
samples: 3
sample_retract_dist: 1.5
samples_result: median
samples_tolerance: 0.040
samples_tolerance_retries: 3

# --- Цифровая фильтрация на стороне MCU (sos_filter, Q12 fixed-point) ---
drift_filter_cutoff_frequency: 0.8   # ФВЧ 2-го порядка: отсекает тепловой дрейф стола
drift_filter_delay: 2
notch_filter_frequencies: 50         # режектор сетевой наводки 50 Гц от грелки стола
notch_filter_quality: 2.0
buzz_filter_cutoff_frequency: 100.0  # ФНЧ 2-го порядка: подавляет звон кулеров и драйверов
buzz_filter_delay: 2

# 0.10 с = ровно 5 периодов сети 50 Гц = ровно 64 отсчёта при 640 Гц.
tare_time: 0.10
