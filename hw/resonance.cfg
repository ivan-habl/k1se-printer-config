# =============================================================================
#  Резонансы: ADXL345, resonance_tester, Klippain Shake&Tune
#  [input_shaper] — в printer.cfg (SHAPER_CALIBRATE -> SAVE_CONFIG).
# =============================================================================

# --- Акселерометр ADXL345 на плате головы (Software SPI) ---------------------
[adxl345]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,-z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 75
probe_points:
    110, 110, 10

# --- Klippain Shake&Tune -----------------------------------------------------
# measurements_chunk_size: 2 (значение по умолчанию) — минимальный расход ОЗУ
# на Orange Pi Zero 3; бóльшие значения ускоряют обработку ценой памяти.
[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300
