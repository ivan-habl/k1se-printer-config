# =============================================================================
#  Экструдер DXC на плате головы (K1-NOZZLE-M_V12, GD32F303CBT6)
#  Связь с Bluepill по USART2 (PA2/PA3); PA10 — датчик филамента,
#  PB10/PB11 — программный UART драйвера TMC2209.
#  [verify_heater extruder] не задан: использовались значения по умолчанию.
# =============================================================================

[extruder]
step_pin: nozzle_mcu:PB1
dir_pin: nozzle_mcu:PB0
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9                # Экструдер DXC
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 6.0
max_extrude_only_accel: 3000
heater_pin: nozzle_mcu:PB7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: nozzle_mcu:PA0
min_temp: 0
max_temp: 320
pressure_advance: 0.064
pressure_advance_smooth_time: 0.030
# Коэффициенты PID — только в блоке SAVE_CONFIG внизу printer.cfg

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
interpolate: True
run_current: 0.55
sense_resistor: 0.150
# Ретракт и wipe выполняет слайсер; [firmware_retraction] не используется.

