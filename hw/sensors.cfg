# =============================================================================
#  Датчики: температура узлов и наличие филамента
#  Температура [mcu] читается в [temperature_fan mcu_fan] (hw/fans.cfg).
# =============================================================================

# --- Температура хоста (Orange Pi Zero 3), Linux MCU не нужен ---------------
[temperature_sensor orange_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

# --- Температура MCU головы (GD32F303CBT6) -----------------------------------
# Требует [temperature_mcu_gd32] (ext/temperature_mcu_gd32.py).
[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 100

# --- Датчики наличия филамента (инвертированная логика !PC15 и !PA10) --------
[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: !PC15
runout_gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G0 E30 F600
        G90
    {% endif %}
insert_gcode:
    M117 Филамент заправлен

[filament_switch_sensor filament_sensor_2]
pause_on_runout: True
switch_pin: !nozzle_mcu:PA10
