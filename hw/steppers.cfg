# =============================================================================
#  Шаговые двигатели и драйверы TMC2209 (основная плата, GD32F303RET6)
#  Драйверы настраиваются нативно, без сторонних плагинов TMC
#  (решение — .kilo/plans/1793764146700-k1se-homing-redesign.md).
# =============================================================================

# -----------------------------------------------------------------------------
# X — CoreXY, Sensorless Homing (StallGuard4), см. macros/homing.cfg
# Порог StallGuard (SGTHRS ниже) подобран при токе home_current (_HOMING_CFG) и этой
# homing_speed. Меняется ток, скорость или механика — подбирать заново.
# hold_current не задавать; stealthchop_threshold не задан (SpreadCycle,
# StealthChop Klipper включает сам на время хоуминга); coolstep_threshold
# не задавать (иначе StallGuard отключится на малых скоростях).
# -----------------------------------------------------------------------------
[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 229
position_min: 0
position_max: 229
homing_speed: 40
homing_retract_dist: 0       # второй заход для sensorless не нужен

[tmc2209 stepper_x]
uart_pin: PA9
uart_address: 3
interpolate: True
run_current: 1.0
sense_resistor: 0.100
diag_pin: ^PB12
driver_TBL: 2                # закрепляют чоппер, при котором подобран порог
driver_TOFF: 3
driver_SGTHRS: 94           # подобран при home_current и homing_speed

# -----------------------------------------------------------------------------
# Y — CoreXY, Sensorless Homing (StallGuard4)
# -----------------------------------------------------------------------------
[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 226
position_min: 0
position_max: 226
homing_speed: 40
homing_retract_dist: 0       # второй заход для sensorless не нужен

[tmc2209 stepper_y]
uart_pin: PA10
uart_address: 3
interpolate: True
run_current: 1.0
sense_resistor: 0.100
diag_pin: ^PB13
driver_TBL: 2                # закрепляют чоппер, при котором подобран порог
driver_TOFF: 3
driver_SGTHRS: 112           # подобран при home_current и homing_speed

# -----------------------------------------------------------------------------
# Z — редуктор 64:20, Single-MCU Homing через CS1237 (probe:z_virtual_endstop)
# И stepper_z, и CS1237 подключены к основному [mcu] -> trsync останавливает
# ось Z внутри одного кристалла без задержек USB.
# G28 Z выполняет полноценный тап через сессию пробы (SAMPLES=1,
# PROBE_SPEED=homing_speed); тап сам отводит стол на sample_retract_dist.
# homing_retract_dist — 0 (один тап) или не меньше sample_retract_dist в
# hw/load_cell.cfg, иначе отвод идёт к соплу.
# -----------------------------------------------------------------------------
[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_max: 255
position_min: -5
homing_speed: 4.0            # первый тап при G28 Z
homing_retract_dist: 2.0     # отвод перед вторым тапом
homing_retract_speed: 10.0   # скорость отвода
second_homing_speed: 2.0     # второй (точный) тап, 3.1 мкм/отсчёт при 640 SPS

[tmc2209 stepper_z]
uart_pin: PA11
uart_address: 3
interpolate: True
run_current: 0.8
sense_resistor: 0.100
# diag_pin не нужен: Z хоумится через датчик нагрузки, а не StallGuard
